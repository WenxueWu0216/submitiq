# Local SQL Server for development.
#   docker compose up -d
#   dotnet ef database update --project src/SubmitIQ.Api
# The password is a local-only development value; Azure uses its own connection string.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SubmitIQ_Dev_Passw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P SubmitIQ_Dev_Passw0rd! -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  sqldata:
