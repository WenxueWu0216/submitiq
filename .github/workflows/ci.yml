name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        run: make setup
      - name: Unit tests
        run: make test
      - name: Eval regression gate (replay backend, all 120 submissions)
        run: make gate
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/scratch/
